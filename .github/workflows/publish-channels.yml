# Publish the two downstream channels of this package, by hand, once the npm
# stage has been approved by a human.
#
# There are three channels and they are three DIFFERENT artefacts, not three
# deployments of one:
#
#   npm     the original. A tarball of `.mjs` files - staged by publish.yml.
#   PyPI    a wheel carrying those same bytes, plus a Python entry point.
#   Homebrew a formula that downloads the release binary at install time.
#
# npm is the channel a human has to approve - `npm stage publish` leaves the
# version in a staging area nothing installs until `npm stage approve`, a 2FA
# decision that belongs to a maintainer and cannot ride along on a CI run. A job
# designed to fail until that decision is made would be a release run that is
# red for hours when nothing is wrong, so the channels live in their own file
# and are RUN, not waited on (ADR-097):
#
#   gh workflow run publish-channels.yml                    # the newest on npm
#   gh workflow run publish-channels.yml -f version=0.5.0   # a named release
#
# The version is an INPUT, not the ref. That is the whole point of this file:
# on a dispatch, `github.ref_name` is the branch the form defaulted to, and the
# version guard would compare a branch name against package.json (ADR-058
# ruling 7). Every job checks out tag v<version> itself and refuses to run when
# the tag is absent or disagrees with the version the tag's package.json claims
# - so the form field is the only thing describing the release, and a wrong
# form field fails loudly instead of publishing a side channel of a version
# this repository never claimed.
#
# ONE resolution, then data (review 0005 PR27, ADR-203). The channels used to
# expand `latest` themselves, in three jobs. A release landing between them split
# one run across two versions, and `0.7.0` and `latest` named the same artifact
# under two different concurrency keys - so two runs could promote one version
# concurrently while neither was waiting for the other. The `resolve` job now
# answers the question once: a concrete version, the commit the tag names, and
# the sha256 of every release asset it downloaded and hashed. That JSON travels
# to each channel as a job output, each channel re-checks it before promoting
# (npm's newest version, the tag, the bytes), and serialisation is per
# DESTINATION on the resolved version - `publish-pypi-0.7.0`, not
# `publish-channels-latest`.
#
# The optional `@simt-dev/bench` package is released beside the core. The
# `verify-bench` job installs the pair by name, from the registry, and runs a
# bench command, so the documented `npm install simt-dev @simt-dev/bench` route
# is checked in the same release run as the downstream channels. It has no
# publish step and no checkbox: it is the release check that the pair a
# maintainer just approved is actually installable.
#
# The dispatch field never reaches a shell through `${{ }}` interpolation. It is
# passed as an environment variable to a script whose first act is to refuse
# everything that is not a concrete x.y.z after trimming; `latest` is a request
# the script expands, not a value any command sees.
#
# Each channel has its own prerequisite, and each job checks it before
# publishing, naming the remedy when it is unmet (ADR-058 ruling 7):
#
#   PyPI    the wheel and the tarball carry the same bytes, so the version must
#           be live on npm - `npm view` serves it, or the stage is still waiting
#           for a maintainer: approve it first.
#   Homebrew the formula downloads the release binary, which publish.yml builds
#           when the tag is pushed - if the assets are not downloadable, the tag
#           never ran, and the tap's checksums are set from what GitHub serves.
#
#   npm stage list
#   npm stage approve <stage-id>
#
# PyPI publishes with **trusted publishing**: an OIDC token exchanged for an
# upload session at PyPI, with no token stored in this repository's secrets.
# It requires the repository to be registered as a trusted publisher on PyPI,
# which is done once on pypi.org and is a property of the project rather than of
# the workflow. It also requires the `pypi` GitHub Environment below - without
# an environment, PyPI has nothing to match the request against.

name: publish channels

on:
  workflow_dispatch:
    inputs:
      # The version of the release whose stage a maintainer just approved,
      # without the `v` the tag wears. `latest` - the default - and an empty
      # field both mean "whatever npm serves as newest"; the resolution lands
      # in one job's outputs as a concrete version before any channel reads it.
      version:
        description: 'the simt-dev version live on npm, or latest for the newest published version'
        required: false
        default: 'latest'
        type: string
      # Which channels this run publishes. Each is a checkbox, and each job
      # below gates on its own - so a run touches only the channels you tick,
      # and an unchecked one is skipped rather than failed. Both default on: a
      # normal release publishes every downstream channel, and a run that wants
      # only one unchecks the rest. (A single `all|pypi|brew` choice would do,
      # but it would special-case "both" inside every job's `if`; a checkbox per
      # channel keeps each gate to the one line that names it.)
      publish-pypi:
        description: 'publish the PyPI channel (wheel + sdist)'
        type: boolean
        default: true
      publish-brew:
        description: 'publish the Homebrew channel (formula to the tap)'
        type: boolean
        default: true

jobs:
  # -------------------------------------------------------------------------
  # One resolution
  resolve:
    name: Resolve the release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.d.outputs.version }}
      commit: ${{ steps.d.outputs.commit }}
      id: ${{ steps.d.outputs.id }}
      descriptor: ${{ steps.d.outputs.descriptor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: d
        name: resolve and validate the whole release
        # The form value is an ENVIRONMENT VARIABLE, never interpolated into the
        # script: `${{ inputs.version }}` inside a `run:` block is text from a
        # dispatch form landing in shell before anything validated it. The
        # script refuses anything but a concrete x.y.z, expands `latest` from the
        # registry, peels the tag to its commit, checks the version is live on
        # npm, downloads every target's asset to hash it, and compares the tap's
        # formula when it already names this version.
        #
        # Its evidence lines are printed for the run log, and the JSON is the job
        # output every channel reads. Nothing downstream resolves anything.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-descriptor.mjs --print

  # -------------------------------------------------------------------------
  # Optional bench package
  #
  # The core does not carry the bench, and the bench declares the core as a
  # peer. Installing only one of them therefore leaves `simt bench` unsupported
  # (core) or has no core to run against (bench). This installs the exact
  # released pair into an empty prefix - no checkout, no source build - and runs
  # an offline replay, which is the cheapest command that loads the optional
  # package through the core's dynamic import.
  verify-bench:
    name: Verify the released bench pair
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged tree answers whether that release was wired for the
          # bench at all. The channels job can be re-run for an older version,
          # which has no bench artifact and must not fail this check.
          ref: v${{ needs.resolve.outputs.version }}

      - id: expected
        name: this release's workflow stages the bench
        run: |
          set -eu
          if grep -Fq 'build-bench-package.mjs dist/bench' .github/workflows/publish.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v${VERSION} predates the optional bench release; skipping the released-pair check"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'

      - name: install the pair by name and run a bench command
        if: steps.expected.outputs.run == 'true'
        # `--prefix` puts node_modules and the bin shim under a directory that
        # has no package.json and is outside any checkout, so the install is
        # resolved from the registry exactly as a consumer would resolve it.
        # `--ignore-scripts` keeps the check about package contents and dynamic
        # loading rather than install-time hooks. The replay document is
        # offline: it needs no agent, no git history and no API key.
        run: |
          set -eu
          prefix="$RUNNER_TEMP/bench-pair"
          mkdir -p "$prefix"
          npm install --prefix "$prefix" --no-audit --no-fund --ignore-scripts --no-save \
            "simt-dev@${VERSION}" "@simt-dev/bench@${VERSION}"
          cat > "$RUNNER_TEMP/bench-replay.json" <<'JSON'
          {
            "trace": {
              "intent": { "digest": "sha256:release-check" },
              "observations": [{ "fields": { "rate": 0.19 } }],
              "events": [{ "id": "release-check" }]
            },
            "before": { "fields": { "rate": 0.19 } },
            "after": { "fields": { "rate": 0.19 } },
            "relations": ["rename-invariance"]
          }
          JSON
          "$prefix/node_modules/.bin/simt" bench replay --input "$RUNNER_TEMP/bench-replay.json"

  # -------------------------------------------------------------------------
  # PyPI
  publish-pypi:
    name: Publish to PyPI
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialised by DESTINATION on the RESOLVED version: a `latest` run and an
    # `0.7.0` run that resolve to the same release queue behind each other
    # instead of racing to upload the same wheel.
    concurrency:
      group: publish-pypi-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    # Runs only when the dispatch ticked this channel. An unchecked box skips
    # the job - it does not fail, so a brew-only run is green end to end.
    if: ${{ inputs['publish-pypi'] }}
    # The GitHub Environment that PyPI's trusted publishing is registered
    # against. Without it the OIDC request has no environment name to match,
    # and PyPI rejects the upload with a message about the publisher rather
    # than the project.
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing exchanges this run's OIDC identity for an upload
      # session; PyPI rejects the exchange without it.
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DESCRIPTOR: ${{ needs.resolve.outputs.descriptor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged tree, not whatever the dispatch form pointed at: the
          # wheel carries the bytes of the release the resolution named, and
          # those bytes have an address - the tag publish.yml stamped.
          ref: v${{ needs.resolve.outputs.version }}

      - name: the release this run resolved has not moved
        # A descriptor is a claim about a moving world. This re-reads npm's
        # newest version, the tag's commit and every asset's bytes, and refuses
        # when any of them disagrees with what the resolve job recorded - the
        # `latest` alias is the case that matters, because a release published
        # between the two jobs would otherwise promote a version this run never
        # resolved.
        run: |
          set -eu
          mkdir -p release
          printf '%s' "$DESCRIPTOR" > release/descriptor.json
          node scripts/release-descriptor.mjs --recheck=release/descriptor.json --print

      - name: the tag is this package's version
        # The dispatch input replaces the tag-ref comparison publish.yml gets
        # for free from its push event. It is the same guard pointed the other
        # way: RESOLVED version against package.json, on the tagged tree, so a
        # typo'd or stale version fails here and not at PyPI.
        run: |
          set -eu
          rendered="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$rendered" ]; then
            echo "::error::version $VERSION does not match package.json version ${rendered} on tag v$VERSION"
            exit 1
          fi
          echo "v$VERSION matches package.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to a specific patch rather than `3.x`. A wheel is built by
          # whatever interpreter ran here, and `py3-none-any` is a promise the
          # package keeps by being pure - a promise a drift in the interpreter's
          # metadata generation could change without any file in this repo moving.
          python-version: '3.12'

      - name: build
        run: |
          set -eu
          python -m pip install --upgrade pip build
          python -m build

      - name: the wheel still carries the npm bytes
        # publish-npm checked parity on the staging path; this job can run on
        # its own, days later, so the check runs here too: a render or a
        # packaging config that drifted since the tag would graduate into a
        # wheel that disagrees with the tarball people already installed.
        run: node scripts/verify-wheel.mjs

      - name: publish
        # Trusted publishing. No token in secrets, and no long-lived credential
        # to rotate when this workflow is ever widened.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # A partial upload is worse than a failed one: the wheel is visible and
        # installable while the sdist is not, so a source install of a version
        # whose wheel exists fails in a way that reads as a broken package
        # rather than a broken release.
        continue-on-error: false

      - name: the registry serves the wheel this run built
        # The other direction of the parity check: what PyPI now installs is
        # byte-for-byte what this run built. A registry that re-packed, or an
        # upload that uploaded something else, is invisible in a green publish
        # step and visible here.
        run: |
          set -eu
          built="$(sha256sum dist/*.whl | cut -d' ' -f1)"
          # `--only-binary :all:` rather than letting pip pick: if the wheel were
          # missing, pip would build one from the sdist and the comparison would pass
          # on bytes PyPI never served - or differ for a reason that has nothing to do
          # with the upload. A missing wheel must fail, not become a local build.
          #
          # An upload is served immediately in practice, but a registry edge can lag a
          # few seconds; five attempts keep a green release from going red on that and
          # still fail loudly when the wheel is genuinely not there.
          attempt=0
          until python -m pip download --only-binary :all: --no-deps --dest /tmp/served "simt-dev==${VERSION}" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "::error::PyPI does not serve wheel simt-dev==${VERSION} after ${attempt} attempts"
              exit 1
            fi
            sleep 5
          done
          served="$(sha256sum /tmp/served/*.whl | cut -d' ' -f1)"
          if [ "$built" != "$served" ]; then
            echo "::error::PyPI serves simt-dev ${VERSION} as ${served}, but this run built ${built}"
            exit 1
          fi
          echo "PyPI serves the wheel this run built (${built})"

  # -------------------------------------------------------------------------
  # Homebrew
  publish-brew:
    name: Publish to Homebrew
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per destination, on the resolved version - see the PyPI job.
    concurrency:
      group: publish-brew-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    # Runs only when the dispatch ticked this channel. An unchecked box skips
    # the job - it does not fail, so a PyPI-only run is green end to end.
    if: ${{ inputs['publish-brew'] }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DESCRIPTOR: ${{ needs.resolve.outputs.descriptor }}
      TAP: ${{ vars.HOMEBREW_TAP || 'QuazarMedia/homebrew-tap' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged tree, for the same reason PyPI's checkout is: the formula
          # is rendered from the release's own source of truth.
          ref: v${{ needs.resolve.outputs.version }}

      - name: the release this run resolved has not moved
        # The resolve job downloaded and hashed every asset, and compared the
        # tap's formula against them when it already named this version. Doing
        # it again here is the same guard as PyPI's, plus the tap: a formula
        # written by a concurrent run between resolution and now would be a
        # checksum this run did not resolve.
        run: |
          set -eu
          mkdir -p release
          printf '%s' "$DESCRIPTOR" > release/descriptor.json
          node scripts/release-descriptor.mjs \
            --recheck=release/descriptor.json \
            --tap="https://raw.githubusercontent.com/${TAP}/main/Formula/simt-dev.rb" \
            --print

      - name: the tag is this package's version
        # Same guard as the PyPI job: the resolved version is compared against
        # the version the tagged package.json claims, and a mismatch stops the
        # job before a formula can name a release this repository never made.
        run: |
          set -eu
          rendered="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$rendered" ]; then
            echo "::error::version $VERSION does not match package.json version ${rendered} on tag v$VERSION"
            exit 1
          fi
          echo "v$VERSION matches package.json"

      - name: install Homebrew
        # `ubuntu-latest` does not ship Homebrew, and `brew style`
        # below is the one step in this job that needs it. The official install
        # script puts Linuxbrew under /home/linuxbrew/.linuxbrew, which is not on
        # PATH - so the install and the PATH line are one step: skip the second
        # and `brew` is installed yet still "command not found".
        run: |
          set -eu
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: render the formula from the resolved release
        # The checksums are the descriptor's - the bytes the resolve job
        # downloaded from the release and hashed - rather than a fresh download
        # in this job. A render step that downloaded its own checksums would be
        # a second resolution, which is the defect this slice removes.
        run: |
          set -eu
          node scripts/release-formula.mjs --descriptor=release/descriptor.json
          git --no-pager diff -- Formula/simt-dev.rb

      - name: the formula lints
        # `brew style` runs the same RuboCop engine that homebrew-core's
        # `brew audit --strict` uses for its style pass, so a formula that would
        # trip those checks fails here - as a red job - instead of arriving later
        # as a rejected tap pull request.
        #
        # This runs after the render above so the style gate sees the version and
        # checksums this release just wrote, not the previous release's.
        #
        # Why `brew style <path>` and not `brew audit --strict`:
        #   * Homebrew 7 disabled the path form of audit ("calling brew audit
        #     [path ...] is disabled"), so audit only runs BY NAME.
        #   * A name resolves through a trusted tap, which means copying the
        #     formula into a throwaway local tap and trusting it first. That works
        #     on macOS but not on the Linuxbrew runner: even after `brew trust`,
        #     `brew audit <name>` reports "No available formula with the name",
        #     so the gate is unreliable on CI.
        #   * `brew style` takes a file path directly, needs no tap, and behaves
        #     identically on both platforms. The full `brew audit --strict` still
        #     runs for real when the formula lands in the tap, where homebrew-core's
        #     bot audits the pull request.
        run: |
          set -eu
          brew style Formula/simt-dev.rb

      - name: push it to the tap
        # The tap lands on its `main`: a release branch that is never merged
        # leaves `brew install` serving the previous version while this run
        # reports success (review 0003 Q04). The variable stays as an escape
        # hatch, but the default is the one name the README and the formula
        # document. Idempotent: a tap that already has these bytes commits
        # nothing and exits 0, so a retry after a later job failed is safe.
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone --quiet --depth 1 --branch main "https://x-access-token:${TOKEN}@github.com/${TAP}.git" /tmp/tap
          cp Formula/simt-dev.rb "/tmp/tap/Formula/simt-dev.rb"
          cd /tmp/tap
          git add Formula/simt-dev.rb
          if git diff --cached --quiet; then
            echo "the tap already has this version; nothing to push"
            exit 0
          fi
          git commit --quiet -m "$(printf 'simt-dev %s\n' "$VERSION")"
          git push --quiet origin main
          echo "pushed simt-dev $VERSION to ${TAP}@main"

  verify-brew:
    name: Verify the tap serves the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [resolve, publish-brew]
    if: ${{ inputs['publish-brew'] }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DESCRIPTOR: ${{ needs.resolve.outputs.descriptor }}
      TAP: ${{ vars.HOMEBREW_TAP || 'QuazarMedia/homebrew-tap' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag the release was cut from, so the comparison runs the checksum
          # reader that release shipped rather than whatever main holds today.
          ref: v${{ needs.resolve.outputs.version }}

      - name: the tap formula names this release's bytes
        # Not just the version: the formula that a `brew install` will follow
        # must name the hashes this run resolved. A version-only check passes on
        # a formula whose checksums belong to different bytes, which is exactly
        # the state a clobbered upload leaves behind.
        run: |
          set -eu
          mkdir -p release
          printf '%s' "$DESCRIPTOR" > release/descriptor.json
          url="https://raw.githubusercontent.com/${TAP}/main/Formula/simt-dev.rb"
          curl -fsSL "$url" -o /tmp/simt-dev.rb
          # A quoted heredoc delimiter, not `-e '...'`: the JavaScript uses
          # `${...}` template literals, and in single quotes shellcheck reads them as
          # shell parameter expansions that do not expand (SC2016). A quoted heredoc
          # says "this text is not shell" once, instead of escaping it line by line.
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { formulaChecksums } from "./src/distribute/descriptor.mjs";
          const descriptor = JSON.parse(fs.readFileSync("release/descriptor.json", "utf8"));
          const declared = formulaChecksums(fs.readFileSync("/tmp/simt-dev.rb", "utf8"), descriptor.version);
          let bad = 0;
          for (const asset of descriptor.assets) {
            const tap = declared.get(asset.target);
            if (tap === undefined) {
              console.error(`::error::the tap formula does not name simt-dev-${descriptor.version}-${asset.target}`);
              bad += 1;
            } else if (tap !== asset.sha256) {
              console.error(`::error::the tap formula names ${tap} for ${asset.target}, but the release serves ${asset.sha256}`);
              bad += 1;
            }
          }
          if (bad > 0) process.exit(1);
          console.log(`the tap serves ${descriptor.version} at the resolved bytes`);
          JS
