# Publish the two downstream channels of this package, by hand, once the npm
# stage has been approved by a human.
#
# There are three channels and they are three DIFFERENT artefacts, not three
# deployments of one:
#
#   npm     the original. A tarball of `.mjs` files - staged by publish.yml.
#   PyPI    a wheel carrying those same bytes, plus a Python entry point.
#   Homebrew a formula that downloads the npm tarball at install time.
#
# npm is the channel a human has to approve - `npm stage publish` leaves the
# version in a staging area nothing installs until `npm stage approve`, a 2FA
# decision that belongs to a maintainer and cannot ride along on a CI run. A job
# designed to fail until that decision is made would be a release run that is
# red for hours when nothing is wrong, so the channels live in their own file
# and are RUN, not waited on (ADR-097):
#
#   gh workflow run publish-channels.yml -f version=0.5.0
#
# The version is an INPUT, not the ref. That is the whole point of this file:
# on a dispatch, `github.ref_name` is the branch the form defaulted to, and the
# version guard would compare a branch name against package.json (ADR-058
# ruling 7). Both jobs below check out tag v<version> itself and refuse to run
# when the tag is absent or disagrees with the version the tag's package.json
# claims - so the form field is the only thing describing the release, and a
# wrong form field fails loudly instead of publishing a side channel of a
# version this repository never claimed.
#
# The order between the channels is forced rather than chosen (ADR-058 ruling
# 7): Homebrew downloads the npm tarball at install time, so a formula naming a
# version that is not live on the npm registry installs a 404. That is why
# every job here begins by checking that `npm view` serves the version, and
# names the remedy when it does not: approve the stage first.
#
#   npm stage list
#   npm stage approve <stage-id>
#
# PyPI publishes with **trusted publishing**: an OIDC token exchanged for an
# upload session at PyPI, with no token stored in this repository's secrets.
# It requires the repository to be registered as a trusted publisher on PyPI,
# which is done once on pypi.org and is a property of the project rather than of
# the workflow. It also requires the `pypi` GitHub Environment below - without
# an environment, PyPI has nothing to match the request against.

name: publish channels

on:
  workflow_dispatch:
    inputs:
      # The version of the release whose stage a maintainer just approved,
      # without the `v` the tag wears. `0.5.0`, not `latest`: a channel named
      # latest publishes a side channel of whatever is newest, which is the one
      # failure this guard exists to prevent.
      version:
        description: 'the simt-dev version live on npm, e.g. 0.5.0'
        required: true
        type: string

concurrency:
  # Serial rather than cancel: two dispatches for the same or neighbouring
  # versions would otherwise race to upload the artefacts, and PyPI has no way
  # to describe a partial upload. A cancelled release is recoverable; a torn
  # one is not.
  group: publish-channels-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # PyPI
  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The GitHub Environment that PyPI's trusted publishing is registered
    # against. Without it the OIDC request has no environment name to match,
    # and PyPI rejects the upload with a message about the publisher rather
    # than the project.
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing exchanges this run's OIDC identity for an upload
      # session; PyPI rejects the exchange without it.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tagged tree, not whatever the dispatch form pointed at: the
          # wheel carries the bytes of the release the input names, and those
          # bytes have an address - the tag publish.yml stamped.
          ref: v${{ inputs.version }}

      - name: the tag is this package's version
        # The dispatch input replaces the tag-ref comparison publish.yml gets
        # for free from its push event. It is the same guard pointed the other
        # way: FORM INPUT against package.json, on the tagged tree, so a
        # typo'd or stale version fails here and not at PyPI.
        run: |
          set -eu
          rendered="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.version }}" != "$rendered" ]; then
            echo "::error::version input ${{ inputs.version }} does not match package.json version ${rendered} on tag v${{ inputs.version }}"
            exit 1
          fi
          echo "v${{ inputs.version }} matches package.json"

      - name: the npm channel has this version
        # The wheel and the tarball carry the same bytes, and a PyPI release
        # whose npm counterpart is still sitting in a staging area is a version
        # where `pip install` and `npm install` give different answers - or,
        # more precisely, where one of them answers nothing at all.
        #
        # This step is what makes running this workflow the intended flow
        # rather than a trick somebody discovers: with the input named and the
        # stage still unapproved, the job says so and names the approval.
        run: |
          set -eu
          version="${{ inputs.version }}"
          if npm view "simt-dev@${version}" version >/dev/null 2>&1; then
            echo "simt-dev@${version} is live on npm"
          else
            echo "::error::simt-dev@${version} is not on the npm registry."
            echo "  The npm channel publishes by STAGING, and a staged version is"
            echo "  not installable until a maintainer approves it. Approve the"
            echo "  stage, then run this workflow again:"
            echo "    npm stage list"
            echo "    npm stage approve <stage-id>"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to a specific patch rather than `3.x`. A wheel is built by
          # whatever interpreter ran here, and `py3-none-any` is a promise the
          # package keeps by being pure - a promise a drift in the interpreter's
          # metadata generation could change without any file in this repo moving.
          python-version: '3.12'

      - name: build
        run: |
          set -eu
          python -m pip install --upgrade pip build
          python -m build

      - name: the wheel still carries the npm bytes
        # publish-npm checked parity on the staging path; this job can run on
        # its own, days later, so the check runs here too: a render or a
        # packaging config that drifted since the tag would graduate into a
        # wheel that disagrees with the tarball people already installed.
        run: node scripts/verify-wheel.mjs

      - name: publish
        # Trusted publishing. No token in secrets, and no long-lived credential
        # to rotate when this workflow is ever widened.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # A partial upload is worse than a failed one: the wheel is visible and
        # installable while the sdist is not, so a source install of a version
        # whose wheel exists fails in a way that reads as a broken package
        # rather than a broken release.
        continue-on-error: false

  # -------------------------------------------------------------------------
  # Homebrew
  publish-brew:
    name: publish to Homebrew
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tagged tree, for the same reason PyPI's checkout is: the
          # formula is rendered from the release's own source of truth.
          ref: v${{ inputs.version }}

      - name: the tag is this package's version
        # Same guard as the PyPI job: the form field is compared against the
        # version the tagged package.json claims, and a mismatch stops the
        # job before a formula can name a release this repository never made.
        run: |
          set -eu
          rendered="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.version }}" != "$rendered" ]; then
            echo "::error::version input ${{ inputs.version }} does not match package.json version ${rendered} on tag v${{ inputs.version }}"
            exit 1
          fi
          echo "v${{ inputs.version }} matches package.json"

      - name: the formula will point at a tarball that exists
        # The reason this channel runs after npm rather than beside it. A formula
        # naming a version that is not on the npm registry installs a 404, and
        # it does so on somebody's machine, at a tap, from a release this run
        # already declared done. Failing here is the only way to make that
        # impossible, and running THIS workflow after the approval - rather
        # than waiting on a job that fails by design - is the whole reason the
        # step above this one is phrased the way it is (ADR-097).
        run: |
          set -eu
          version="${{ inputs.version }}"
          url="https://registry.npmjs.org/simt-dev/-/simt-dev-${version}.tgz"
          if curl -fsSL -o /tmp/simt-dev.tgz "$url"; then
            echo "fetching ${url}"
          else
            echo "::error::${url} is not downloadable."
            echo "  The npm channel publishes by STAGING, and a staged version is"
            echo "  not downloadable until a maintainer approves it. Approve the"
            echo "  stage, then run this workflow again:"
            echo "    npm stage approve <stage-id>"
            exit 1
          fi
          sha256="$(shasum -a 256 /tmp/simt-dev.tgz | cut -d' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_ENV"
          echo "simt-dev@${version} is live at ${url} (sha256 ${sha256})"

      - name: the formula builds and lints
        # `brew audit --strict` is the same check homebrew-core runs. A formula
        # that would be rejected there is a tap that will not be accepted, and
        # the failure would arrive as a rejected pull request rather than as a
        # red job.
        run: |
          set -eu
          brew audit --strict Formula/simt-dev.rb

      - name: render the formula for this release
        run: |
          set -eu
          node scripts/release-formula.mjs \
            --version="${{ inputs.version }}" \
            --sha256="${sha256}"
          git --no-pager diff -- Formula/simt-dev.rb

      - name: push it to the tap
        # The tap is a normal repository named `homebrew-<something>`. It is
        # configurable rather than hardcoded because the owner's account may not
        # be the owner that matters later - and a tap URL is the one thing in
        # this workflow that is not about the tool.
        env:
          TAP: ${{ vars.HOMEBREW_TAP || 'QuazarMedia/homebrew-tap' }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          tap="${TAP}"
          branch="release/simt-dev-${{ inputs.version }}"
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${tap}.git" /tmp/tap
          cp Formula/simt-dev.rb "/tmp/tap/Formula/simt-dev.rb"
          cd /tmp/tap
          git checkout -b "${branch}"
          git add Formula/simt-dev.rb
          if git diff --cached --quiet; then
            echo "the tap already has this version; nothing to push"
            exit 0
          fi
          git commit --quiet -m "$(printf 'simt-dev %s\n' "${{ inputs.version }}")"
          git push --quiet origin "${branch}"
          echo "pushed ${branch} to ${tap} - open a PR, or merge it directly to update the tap"
