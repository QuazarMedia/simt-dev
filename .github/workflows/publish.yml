# Publish this package when a version tag is pushed.
#
# The tag is the trigger, so the tag is also the version. A tag that disagrees with
# package.json is refused rather than published: `v0.2.0` on a package.json that says
# 0.1.0 would put a version on the registry that no file in the repository claims,
# and nothing would notice until somebody installed it.
#
# It STAGES the release with `npm stage publish`, which submits the tarball to npm's
# staging area rather than to the live registry. Nothing becomes installable until a
# maintainer reviews it and runs `npm stage approve` (or clicks Approve on npmjs.com),
# and that approval is the step that requires 2FA. Staging itself does not - which is
# the point: the pipeline can submit, and only a person can release.
#
#   npm stage list                 # what is waiting
#   npm stage view <stage-id>      # inspect it
#   npm stage approve <stage-id>   # publish it, with 2FA
#
# This is deliberately NOT `npm publish --tag <something>`. A dist-tag does not gate
# anything - the bytes are public the moment they are uploaded, and a dist-tag only
# changes which name resolves to them by default. Staging is a real approval step.
#
# `--provenance` is not decoration: it is the signature saying these bytes were built
# by this workflow at this commit, which is the whole reason a gate that other people
# run is shipped from CI rather than from a laptop. It needs `id-token: write`.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Provenance is an attestation signed by this run's OIDC identity. Without this the
  # publish would ship without one, or fail asking for one.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: stage ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor in this package's `engines.node`. The version that publishes is
          # the version that runs, so it is started on the floor rather than on whatever
          # the runner happens to ship. It is also above the floor staged publishing
          # needs (Node 22.14.0), which is worth re-checking if this ever moves.
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org

      - name: the tag is this package's version
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$tagged" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json"

      - name: this version is not already on the registry
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          # Re-running a workflow is normal; staging the same version twice is not
          # possible, and failing the job for it would page somebody for nothing. Note
          # this checks the REGISTRY, not the staging area: a staged version is not
          # publicly visible, so a re-run after a successful stage still looks
          # unpublished here. `npm stage list` is the other half of that answer.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; nothing to stage"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: tests
        # Staging is the reversible half of a release, but the bytes still left the
        # building, so they are checked before they go rather than after. A green
        # `main` is no guarantee about this tag: a tag can point at any commit,
        # including one that never passed the gate.
        if: env.SKIP == 'false'
        run: npm test

      - name: skill registry lint
        if: env.SKIP == 'false'
        run: node bin/simt-dev.mjs graph lint

      - name: staged publishing needs an npm that has it
        run: |
          set -eu
          # `npm stage` landed in npm 11.15.0. Node 22.20.0 - the floor this package
          # runs on - bundles npm 10, so the version this workflow ships with cannot
          # stage anything and fails with `Unknown command: "stage"`, which says nothing
          # about the package and everything about the runner.
          #
          # Checked rather than assumed: an unconditional `npm i -g npm@latest` would
          # fetch a new npm on every release whether or not the one present already
          # knows how to stage, and the release's bytes would then depend on a registry
          # fetch the release itself performs.
          if ! npm stage --help >/dev/null 2>&1; then
            echo "npm $(npm --version) cannot stage; installing one that can"
            npm install -g npm@latest
          fi
          npm --version

      - name: stage for a maintainer to approve
        if: env.SKIP == 'false'
        run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: what is now waiting
        # The stage id is what a maintainer passes to `npm stage approve`, and the job
        # log is not where anyone looks for it hours later.
        if: env.SKIP == 'false'
        run: npm stage list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}