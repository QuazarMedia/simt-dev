# Publish the npm channel of this package when a version tag is pushed.
#
# There are three channels and they are three DIFFERENT artefacts, not three
# deployments of one:
#
#   npm     the original. A tarball of `.mjs` files.
#   PyPI    a wheel carrying those same bytes, plus a Python entry point.
#   Homebrew a formula that downloads the npm tarball at install time.
#
# This workflow owns only the first, and deliberately stops there. Staging an npm
# release is the one step of a release that has to wait for a human: `npm stage
# publish` puts the version in a staging area nothing installs until `npm stage
# approve` - a 2FA decision that belongs to a maintainer, not to CI. The two
# downstream channels run from `.github/workflows/publish-channels.yml`, BY HAND,
# after that approval, and the story of the split plus the reason the version
# travels into them as an input lives in ADR-097.
#
#   push tag v0.1.2
#     -> publish.yml            stages the release, nothing is installable yet
#     -> (human, 2FA)           npm stage approve <id>
#     -> publish-channels.yml   run by hand with the version as its input
#
# Nothing here is red in a healthy release. A job designed to fail until a human
# acts again would be a gate that is red on the day it lands, and a reader learns
# to ignore red exactly once - ADR-097 holds the argument and the old layout.
#
# PyPI publishes with **trusted publishing**: an OIDC token exchanged for an
# upload session at PyPI, with no token stored in this repository's secrets.
# It requires the repository to be registered as a trusted publisher on PyPI,
# which is done once on pypi.org and is a property of the project rather than of
# the workflow. It also requires the `pypi` GitHub Environment - without an
# environment, PyPI has nothing to match the request against.
#
# Provenance on npm is requested only when it can exist: npm verifies a sigstore
# bundle against a PUBLIC source repository and rejects a private one. Making
# this repository public turns attestation on with no edit here.

name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Serial rather than cancel: two tags pushed in quick succession would
  # otherwise race to publish the same version, and PyPI has no way to describe
  # a partial upload. A cancelled release is recoverable; a torn one is not.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the trigger, so the tag is the version. A tag that disagrees with
  # package.json is refused rather than published: `v0.2.0` on a package.json
  # that says 0.1.0 would put a version on a registry that no file in this
  # repository claims, and nothing would notice until somebody installed it.
  version:
    name: the tag is this package's version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$tagged" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF_NAME} matches package.json"

  # -------------------------------------------------------------------------
  # npm
  publish-npm:
    name: stage ${{ github.ref_name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance is an attestation signed by this run's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `bench mine` counts commits, and the Affects snapshot reads
          # 4c27514. A depth-1 checkout fails both, and both run in `npm test`.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor in this package's `engines.node`. The version that
          # publishes is the version that runs, so it is started on the floor
          # rather than on whatever the runner happens to ship.
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org

      - name: this version is not already on the registry
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          name="$(node -p "require('./package.json').name")"
          # Re-running a workflow is normal; staging the same version twice is
          # not possible, and failing the job for it would page somebody for
          # nothing. This checks the REGISTRY, not the staging area: a staged
          # version is not publicly visible, so a re-run after a successful
          # stage still looks unpublished here.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; nothing to stage"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: tests
        # Staging is the reversible half of a release, but the bytes still left
        # the building. A green `main` is no guarantee about this tag: a tag can
        # point at any commit, including one that never passed the gate.
        if: env.SKIP == 'false'
        run: npm test

      - name: skill registry lint
        if: env.SKIP == 'false'
        run: node bin/simt-dev.mjs graph lint

      # The same file the wheel later carries. A PyPI wheel holding different
      # rules than the npm tarball is the defect this whole release path is
      # meant to make impossible, and it is caught here rather than discovered
      # from two installs of two channels.
      #
      # `scripts/verify-wheel.mjs` rather than `test/packaging.test.mjs`: the
      # tests hold the *static* invariants and run in `npm test`, while this
      # builds both artefacts and hashes every file, which needs a Python and a
      # registry - both of which are available here and neither of which is
      # available on the laptop of the next person who clones this repository.
      - name: the wheel carries these bytes
        if: env.SKIP == 'false'
        run: node scripts/verify-wheel.mjs

      - name: staged publishing needs an npm that has it
        # `npm stage` landed in npm 11.15.0. The node floor in this package's
        # engines - 22.20.0 - bundles npm 10, which fails with `Unknown command:
        # "stage"`: an error that says nothing about the package and everything
        # about the runner, arriving after the tests passed.
        #
        # The major is pinned to 11 for the same reason the floor is. npm 12
        # requires node ^22.22.2, so `npm@latest` cannot be installed on the very
        # node this package declares it runs on - and bumping the floor to
        # satisfy the release tool would mean the floor is set by what npm
        # happens to ship this month rather than by what this package needs.
        #
        # Checked rather than assumed: installing unconditionally would fetch an
        # npm on every release whether or not the one present already stages,
        # and a release's bytes would depend on a registry fetch it performs.
        run: |
          set -eu
          if ! npm stage --help >/dev/null 2>&1; then
            echo "npm $(npm --version) cannot stage; installing one that can"
            npm install -g npm@11
          fi
          npm --version
          npm stage --help >/dev/null

      - name: stage for a maintainer to approve
        if: env.SKIP == 'false'
        run: |
          set -eu
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            echo "repository is public; publishing with provenance"
            npm stage publish --provenance --tag latest
          else
            echo "repository is private; npm provenance requires a public source, staging without it"
            npm stage publish --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: what is now waiting
        # The stage id is what a maintainer passes to `npm stage approve`, and
        # the job log is not where anyone looks for it hours later.
        if: env.SKIP == 'false'
        run: npm stage list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # GitHub release
  #
  # The tag is pushed, the version is validated, and the npm channel is staged:
  # this is the end of what CI is allowed to do, and it is where a release
  # record belongs. The two downstream channels (PyPI, Homebrew) run by hand from
  # publish-channels.yml after a maintainer approves the stage, so this job does
  # not wait on them - it records the version that is now staged, with the notes
  # for exactly that version cut out of CHANGELOG.md.
  create-release:
    name: create the release
    needs: [version, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # A release is a content object, so writing one needs contents:write.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cut this version's notes out of the changelog
        # CHANGELOG.md is Keep-a-Changelog: each version is a `## [X.Y.Z]` block
        # running to the next `## [`. Cutting the block for the version this tag
        # names - rather than pasting the whole file, or the Unreleased block -
        # is what makes the release notes say what THIS release changed. The
        # match is a fixed-string prefix, so the dots in the version are not
        # read as regex. A version with no block yet (published before notes
        # were written) falls back to the version line rather than an empty body.
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no changelog block for $version; using the version line"
            printf 'simt-dev %s\n' "$version" > release-notes.md
          fi
          echo "::group::release notes for $version"
          cat release-notes.md
          echo "::endgroup::"

      - name: create or update the release
        # Idempotent: re-running the workflow for a tag must not fail on an
        # existing release, so an existing one has its notes refreshed rather
        # than the create being retried. The title defaults to the tag name.
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} exists; refreshing its notes"
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
