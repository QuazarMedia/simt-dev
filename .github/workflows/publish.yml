# Publish this package, to three places, when a version tag is pushed.
#
# The three channels are not three deployments of one artefact. They are three
# DIFFERENT artefacts, and the order between two of them is forced rather than
# chosen:
#
#   npm     the original. A tarball of `.mjs` files.
#   PyPI    a wheel carrying those same bytes, plus a Python entry point.
#   Homebrew a formula that downloads the npm tarball at install time.
#
# Homebrew consumes what npm produced, so the npm version has to be LIVE before
# a formula naming it can work - `brew install` would otherwise fetch a 404.
# That is why the `publish-brew` and `publish-pypi` jobs below both begin by
# checking `npm view`, and why they are the jobs a maintainer runs again after
# approving the stage.
#
#   push tag v0.1.2
#     -> publish-npm     stages the release, nothing is installable yet
#     -> (human, 2FA)    npm stage approve <id>
#     -> publish-pypi    re-run this job; it now succeeds
#     -> publish-brew    re-run this job; it now succeeds
#
# "Re-run failed jobs" is the supported action and it carries the tag context,
# which a `workflow_dispatch` does not - on a dispatch, `github.ref_name` is the
# branch, and the version guard below would compare a tag against a branch.
#
# PyPI publishes with **trusted publishing**: an OIDC token exchanged for an
# upload session at PyPI, with no token stored in this repository's secrets.
# It requires the repository to be registered as a trusted publisher on PyPI,
# which is done once on pypi.org and is a property of the project rather than of
# the workflow. It also requires the `pypi` GitHub Environment below - without
# an environment, PyPI has nothing to match the request against.
#
# Provenance on npm is requested only when it can exist: npm verifies a sigstore
# bundle against a PUBLIC source repository and rejects a private one. Making
# this repository public turns attestation on with no edit here.

name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Serial rather than cancel: two tags pushed in quick succession would
  # otherwise race to publish the same version, and PyPI has no way to describe
  # a partial upload. A cancelled release is recoverable; a torn one is not.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the trigger, so the tag is the version. A tag that disagrees with
  # package.json is refused rather than published: `v0.2.0` on a package.json
  # that says 0.1.0 would put a version on a registry that no file in this
  # repository claims, and nothing would notice until somebody installed it.
  version:
    name: the tag is this package's version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$tagged" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF_NAME} matches package.json"

  # -------------------------------------------------------------------------
  # npm
  publish-npm:
    name: stage ${{ github.ref_name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance is an attestation signed by this run's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `bench mine` counts commits, and the Affects snapshot reads
          # 4c27514. A depth-1 checkout fails both, and both run in `npm test`.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor in this package's `engines.node`. The version that
          # publishes is the version that runs, so it is started on the floor
          # rather than on whatever the runner happens to ship.
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org

      - name: this version is not already on the registry
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          name="$(node -p "require('./package.json').name")"
          # Re-running a workflow is normal; staging the same version twice is
          # not possible, and failing the job for it would page somebody for
          # nothing. This checks the REGISTRY, not the staging area: a staged
          # version is not publicly visible, so a re-run after a successful
          # stage still looks unpublished here.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; nothing to stage"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: tests
        # Staging is the reversible half of a release, but the bytes still left
        # the building. A green `main` is no guarantee about this tag: a tag can
        # point at any commit, including one that never passed the gate.
        if: env.SKIP == 'false'
        run: npm test

      - name: skill registry lint
        if: env.SKIP == 'false'
        run: node bin/simt-dev.mjs graph lint

      # The same file the wheel later carries. A PyPI wheel holding different
      # rules than the npm tarball is the defect this whole release path is
      # meant to make impossible, and it is caught here rather than discovered
      # from two installs of two channels.
      #
      # `scripts/verify-wheel.mjs` rather than `test/packaging.test.mjs`: the
      # tests hold the *static* invariants and run in `npm test`, while this
      # builds both artefacts and hashes every file, which needs a Python and a
      # registry - both of which are available here and neither of which is
      # available on the laptop of the next person who clones this repository.
      - name: the wheel carries these bytes
        if: env.SKIP == 'false'
        run: node scripts/verify-wheel.mjs

      - name: staged publishing needs an npm that has it
        # `npm stage` landed in npm 11.15.0. The node floor in this package's
        # engines - 22.20.0 - bundles npm 10, which fails with `Unknown command:
        # "stage"`: an error that says nothing about the package and everything
        # about the runner, arriving after the tests passed.
        #
        # The major is pinned to 11 for the same reason the floor is. npm 12
        # requires node ^22.22.2, so `npm@latest` cannot be installed on the very
        # node this package declares it runs on - and bumping the floor to
        # satisfy the release tool would mean the floor is set by what npm
        # happens to ship this month rather than by what this package needs.
        #
        # Checked rather than assumed: installing unconditionally would fetch an
        # npm on every release whether or not the one present already stages,
        # and a release's bytes would depend on a registry fetch it performs.
        run: |
          set -eu
          if ! npm stage --help >/dev/null 2>&1; then
            echo "npm $(npm --version) cannot stage; installing one that can"
            npm install -g npm@11
          fi
          npm --version
          npm stage --help >/dev/null

      - name: stage for a maintainer to approve
        if: env.SKIP == 'false'
        run: |
          set -eu
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            echo "repository is public; publishing with provenance"
            npm stage publish --provenance --tag latest
          else
            echo "repository is private; npm provenance requires a public source, staging without it"
            npm stage publish --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: what is now waiting
        # The stage id is what a maintainer passes to `npm stage approve`, and
        # the job log is not where anyone looks for it hours later.
        if: env.SKIP == 'false'
        run: npm stage list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # PyPI
  publish-pypi:
    name: publish to PyPI
    needs:
      - version
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The GitHub Environment that PyPI's trusted publishing is registered
    # against. Without it the OIDC request has no environment name to match,
    # and PyPI rejects the upload with a message about the publisher rather
    # than the project.
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing exchanges this run's OIDC identity for an upload
      # session; PyPI rejects the exchange without it.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: the npm channel has this version
        # The wheel and the tarball carry the same bytes, and a PyPI release
        # whose npm counterpart is still sitting in a staging area is a version
        # where `pip install` and `npm install` give different answers - or,
        # more precisely, where one of them answers nothing at all.
        #
        # This is the step that makes re-running the job after approving the
        # stage the intended flow, rather than a trick somebody discovers.
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          if npm view "simt-dev@${version}" version >/dev/null 2>&1; then
            echo "simt-dev@${version} is live on npm"
          else
            echo "::error::simt-dev@${version} is not on the npm registry."
            echo "  The npm channel publishes by STAGING, and a staged version is"
            echo "  not installable until a maintainer approves it. So either"
            echo "  the stage has not been approved yet, or the publish-npm job failed."
            echo "  Approve the stage, then re-run this job."
            echo "    npm stage list"
            echo "    npm stage approve <stage-id>"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to a specific patch rather than `3.x`. A wheel is built by
          # whatever interpreter ran here, and `py3-none-any` is a promise the
          # package keeps by being pure - a promise a drift in the interpreter's
          # metadata generation could change without any file in this repo moving.
          python-version: '3.12'

      - name: build
        run: |
          set -eu
          python -m pip install --upgrade pip build
          python -m build

      - name: the wheel still carries the npm bytes
        # Checked again here, not only in publish-npm: that job runs on the npm
        # path and this one can be re-run on its own, and a re-run of a job that
        # skipped its checks because `SKIP=true` would otherwise publish a wheel
        # built from a tree whose packaging config had since changed.
        run: node scripts/verify-wheel.mjs

      - name: publish
        # Trusted publishing. No token in secrets, and no long-lived credential
        # to rotate when this workflow is ever widened.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # A partial upload is worse than a failed one: the wheel is visible and
        # installable while the sdist is not, so a source install of a version
        # whose wheel exists fails in a way that reads as a broken package
        # rather than a broken release.
        continue-on-error: false

  # -------------------------------------------------------------------------
  # Homebrew
  publish-brew:
    name: publish to Homebrew
    needs:
      - version
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: the formula will point at a tarball that exists
        # The reason this job runs after npm rather than beside it. A formula
        # naming a version that is not on the npm registry installs a 404, and
        # it does so on somebody's machine, at a tap, from a release this run
        # already declared done. Failing here is the only way to make that
        # impossible, and re-running after the approval is the whole reason the
        # step above this one is phrased the way it is.
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          url="https://registry.npmjs.org/simt-dev/-/simt-dev-${version}.tgz"
          if curl -fsSL -o /tmp/simt-dev.tgz "$url"; then
            echo "fetching ${url}"
          else
            echo "::error::${url} is not downloadable."
            echo "  The npm channel publishes by STAGING, and a staged version is"
            echo "  not downloadable until a maintainer approves it."
            echo "  Approve the stage, then re-run this job:"
            echo "    npm stage approve <stage-id>"
            exit 1
          fi
          sha256="$(shasum -a 256 /tmp/simt-dev.tgz | cut -d' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_ENV"
          echo "simt-dev@${version} is live at ${url} (sha256 ${sha256})"

      - name: the formula builds and lints
        # `brew audit --strict` is the same check homebrew-core runs. A formula
        # that would be rejected there is a tap that will not be accepted, and
        # the failure would arrive as a rejected pull request rather than as a
        # red job.
        run: |
          set -eu
          brew audit --strict Formula/simt-dev.rb

      - name: render the formula for this release
        run: |
          set -eu
          node scripts/release-formula.mjs \
            --version="${{ needs.version.outputs.version }}" \
            --sha256="${sha256}"
          git --no-pager diff -- Formula/simt-dev.rb

      - name: push it to the tap
        # The tap is a normal repository named `homebrew-<something>`. It is
        # configurable rather than hardcoded because the owner's account may not
        # be the owner that matters later - and a tap URL is the one thing in
        # this workflow that is not about the tool.
        env:
          TAP: ${{ vars.HOMEBREW_TAP || 'QuazarMedia/homebrew-tap' }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          tap="${TAP}"
          branch="release/simt-dev-${{ needs.version.outputs.version }}"
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${tap}.git" /tmp/tap
          cp Formula/simt-dev.rb "/tmp/tap/Formula/simt-dev.rb"
          cd /tmp/tap
          git checkout -b "${branch}"
          git add Formula/simt-dev.rb
          if git diff --cached --quiet; then
            echo "the tap already has this version; nothing to push"
            exit 0
          fi
          git commit --quiet -m "$(printf 'simt-dev %s\n' "${{ needs.version.outputs.version }}")"
          git push --quiet origin "${branch}"
          echo "pushed ${branch} to ${tap} - open a PR, or merge it directly to update the tap"
